<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cat Care App</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#fef5f0;color:#333;padding-bottom:80px}
.header{background:linear-gradient(135deg,#ff6b9d,#ff8a65);color:white;padding:15px 20px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:20px}
.header button{background:rgba(255,255,255,.3);border:0;color:white;border-radius:8px;padding:8px 12px;font-size:20px;cursor:pointer}
.sync-bar{position:fixed;top:56px;left:0;right:0;background:#4caf50;color:white;text-align:center;padding:7px;font-size:13px;z-index:999;display:none}
.sync-bar.show{display:block}.sync-bar.error{background:#f44336}.sync-bar.loading{background:#2196f3}
.page{display:none;padding:15px;max-width:700px;margin:auto}
.page.active{display:block}
.card{background:white;border-radius:15px;padding:18px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card h2{color:#ff6b9d;font-size:18px;margin-bottom:14px}
.form-group{margin-bottom:12px}
label{display:block;font-weight:bold;color:#666;font-size:14px;margin-bottom:5px}
input,select,textarea{width:100%;padding:10px;border:2px solid #f0e0d6;border-radius:8px;font-size:15px;background:white}
textarea{min-height:80px;resize:vertical}
.btn{width:100%;padding:12px;border:0;border-radius:10px;background:linear-gradient(135deg,#ff6b9d,#ff8a65);color:white;font-weight:bold;font-size:16px;cursor:pointer}
.btn-small{width:auto;padding:7px 12px;border:0;border-radius:8px;background:#ff6b9d;color:white;cursor:pointer}
.btn-edit{padding:6px 10px;border:0;border-radius:8px;background:#ffa726;color:white;cursor:pointer}
.btn-del{padding:6px 10px;border:0;border-radius:8px;background:#f44336;color:white;cursor:pointer}
.record-actions{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;box-shadow:0 -2px 10px rgba(0,0,0,.1);z-index:500;overflow-x:auto}
.bottom-nav button{flex:1;min-width:58px;padding:8px 2px;border:0;background:white;color:#999;font-size:10px;cursor:pointer;white-space:nowrap}
.bottom-nav button.active{color:#ff6b9d;font-weight:bold}
.bottom-nav span{display:block;font-size:21px}
.empty{text-align:center;color:#bbb;padding:35px 10px}
.empty span{font-size:48px;display:block;margin-bottom:8px}
.cat-tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}
.cat-tab{border:2px solid #ff6b9d;color:#ff6b9d;border-radius:20px;background:white;padding:7px 15px;white-space:nowrap;cursor:pointer;font-weight:bold}
.cat-tab.active{background:#ff6b9d;color:white}
.info-row{display:flex;justify-content:space-between;border-bottom:1px solid #f5f5f5;padding:10px 0;font-size:14px}
.info-row .label{color:#aaa}.info-row .value{font-weight:bold}
.badge{display:inline-block;background:#ff6b9d;color:white;border-radius:12px;padding:2px 8px;font-size:11px}
.record{padding:12px;border-bottom:1px solid #eee}
.record-title{font-weight:bold}
.record-meta{font-size:12px;color:#999;margin-top:3px}
.record-note{font-size:13px;color:#666;margin-top:4px;line-height:1.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#fff0f5;border:1px solid #ffd0df;border-radius:12px;text-align:center;padding:13px}
.stat .num{font-size:22px;font-weight:bold;color:#ff6b9d}
.stat .txt{font-size:12px;color:#999}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:800}
.overlay.show{display:block}
.panel{position:fixed;left:0;right:0;bottom:0;background:white;border-radius:16px 16px 0 0;padding:20px;max-height:88vh;overflow:auto;transform:translateY(110%);transition:.25s;z-index:900}
.panel.show{transform:translateY(0)}
.panel-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.panel-top h2{color:#ff6b9d}
.panel-close{border:0;background:white;font-size:24px;color:#999;cursor:pointer}
.photo{width:95px;height:95px;border-radius:50%;object-fit:cover;border:3px solid #f0e0d6;background:#fde8ee;display:block;margin:0 auto 8px}
.photo-placeholder{width:95px;height:95px;border-radius:50%;background:#fde8ee;display:flex;align-items:center;justify-content:center;font-size:42px;margin:0 auto 8px}
.warning{background:#fff3cd;border:1px solid #ffc107;color:#856404;border-radius:10px;padding:10px;margin-bottom:12px;font-size:14px}
.category-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{border:2px solid #f0e0d6;border-radius:20px;background:white;color:#888;padding:7px 12px;font-size:13px;cursor:pointer}
.chip.active{border-color:#ff6b9d;background:#fff0f5;color:#ff6b9d;font-weight:bold}
</style>
</head>

<body>
<div id="syncBar" class="sync-bar"></div>

<div class="header">
  <h1>🐱 Cat Care</h1>
  <button onclick="openCatPanel()">＋</button>
</div>

<div id="page-profile" class="page active">
  <div id="catTabs" class="cat-tabs"></div>
  <div id="profileCard" class="card"></div>
  <div id="weightCard" class="card" style="display:none">
    <h2>⚖️ 體重記錄</h2>
    <div class="grid">
      <input type="date" id="weightDate">
      <input type="number" id="weightValue" placeholder="kg" step="0.1">
    </div>
    <br>
    <button class="btn" onclick="addWeight()">新增體重</button>
    <div id="weightList"></div>
  </div>
</div>

<div id="page-daily" class="page">
  <div class="card">
    <h2>🍽️ 飲食記錄</h2>
    <div class="form-group"><label>貓咪</label><select id="foodCat"></select></div>
    <div class="form-group"><label>日期</label><input type="date" id="foodDate"></div>
    <div class="grid">
      <input type="number" id="foodDry" placeholder="乾糧 g">
      <input type="number" id="foodWet" placeholder="罐頭 g">
    </div>
    <br>
    <input type="number" id="foodWater" placeholder="飲水 ml">
    <br><br>
    <input type="text" id="foodNote" placeholder="備註">
    <br><br>
    <button class="btn" onclick="saveFood()">儲存飲食</button>
  </div>

  <div class="card">
    <h2>🚽 排泄記錄</h2>
    <div class="form-group"><label>貓咪</label><select id="toiletCat"></select></div>
    <div class="form-group"><label>日期時間</label><input type="datetime-local" id="toiletDate"></div>
    <div class="grid">
      <select id="poopCount">
        <option value="0">大便 0 次</option><option value="1" selected>大便 1 次</option>
        <option value="2">大便 2 次</option><option value="3">大便 3 次</option>
      </select>
      <select id="peeCount">
        <option value="0">尿 0 塊</option><option value="1">尿 1 塊</option>
        <option value="2" selected>尿 2 塊</option><option value="3">尿 3 塊</option>
        <option value="4">尿 4+ 塊</option>
      </select>
    </div>
    <br>
    <select id="poopType">
      <option value="正常">便便正常</option>
      <option value="硬/乾">硬/乾</option>
      <option value="軟便">軟便</option>
      <option value="腹瀉">腹瀉</option>
      <option value="帶血">帶血</option>
    </select>
    <br><br>
    <input type="text" id="toiletNote" placeholder="備註">
    <br><br>
    <button class="btn" onclick="saveToilet()">儲存排泄</button>
  </div>

  <div id="dailyWarning"></div>

  <div class="card">
    <h2>📊 今日統計</h2>
    <div id="dailyStats" class="grid"></div>
  </div>

  <div class="card">
    <h2>📋 日常記錄</h2>
    <div id="dailyList"></div>
  </div>
</div>

<div id="page-abnormal" class="page">
  <div class="card">
    <h2>⚠️ 異常行為</h2>
    <div class="form-group"><label>貓咪</label><select id="abnCat"></select></div>
    <div class="form-group"><label>日期時間</label><input type="datetime-local" id="abnDate"></div>
    <div class="category-row" id="symptomRow">
      <button class="chip" onclick="toggleChip(this)">🤮 嘔吐</button>
      <button class="chip" onclick="toggleChip(this)">💩 腹瀉</button>
      <button class="chip" onclick="toggleChip(this)">😿 食慾不振</button>
      <button class="chip" onclick="toggleChip(this)">💧 頻尿</button>
      <button class="chip" onclick="toggleChip(this)">😴 嗜睡</button>
      <button class="chip" onclick="toggleChip(this)">🦿 跛腳</button>
      <button class="chip" onclick="toggleChip(this)">👁️ 眼睛異常</button>
      <button class="chip" onclick="toggleChip(this)">❓ 其他</button>
    </div>
    <textarea id="abnDesc" placeholder="詳細描述"></textarea>
    <br><br>
    <button class="btn" onclick="saveAbnormal()">儲存異常記錄</button>
  </div>
  <div class="card"><h2>📋 異常記錄</h2><div id="abnList"></div></div>
</div>

<div id="page-hospital" class="page">
  <div class="card">
    <h2>🏥 就診記錄</h2>
    <div class="form-group"><label>貓咪</label><select id="hospCat"></select></div>
    <input type="date" id="hospDate">
    <br><br>
    <input type="text" id="hospReason" placeholder="就診原因">
    <br><br>
    <input type="text" id="hospName" placeholder="醫院名稱">
    <br><br>
    <textarea id="hospNote" placeholder="診斷、藥物、備註"></textarea>
    <br><br>
    <input type="number" id="hospCost" placeholder="費用">
    <br><br>
    <button class="btn" onclick="saveHospital()">儲存就診</button>
  </div>
  <div class="card"><h2>📋 就診歷史</h2><div id="hospList"></div></div>
</div>

<div id="page-vaccine" class="page">
  <div class="card">
    <h2>💉 疫苗/驅蟲</h2>
    <div class="form-group"><label>貓咪</label><select id="vacCat"></select></div>
    <select id="vacType">
      <option value="三合一疫苗">三合一疫苗</option>
      <option value="狂犬病疫苗">狂犬病疫苗</option>
      <option value="體內驅蟲">體內驅蟲</option>
      <option value="體外驅蟲">體外驅蟲</option>
      <option value="其他">其他</option>
    </select>
    <br><br>
    <label>施打/使用日期</label>
    <input type="date" id="vacDate">
    <br><br>
    <label>下次日期，不填會自動計算</label>
    <input type="date" id="vacNext">
    <br><br>
    <input type="text" id="vacNote" placeholder="品牌、批號、備註">
    <br><br>
    <button class="btn" onclick="saveVaccine()">儲存疫苗/驅蟲</button>
  </div>
  <div class="card"><h2>📋 提醒狀態</h2><div id="vacList"></div></div>
</div>

<div id="page-diary" class="page">
  <div class="card">
    <h2>📔 日記</h2>
    <input type="date" id="diaryDate">
    <br><br>
    <textarea id="diaryText" placeholder="今天發生了什麼？"></textarea>
    <br><br>
    <button class="btn" onclick="saveDiary()">儲存日記</button>
  </div>
  <div class="card"><h2>📖 日記列表</h2><div id="diaryList"></div></div>
</div>

<div id="page-expense" class="page">
  <div class="card">
    <h2>💰 支出</h2>
    <div class="form-group"><label>貓咪</label><select id="expCat"></select></div>
    <input type="date" id="expDate">
    <br><br>
    <select id="expCategory">
      <option value="🍖 食品">🍖 食品</option>
      <option value="💊 醫療">💊 醫療</option>
      <option value="🎾 玩具">🎾 玩具</option>
      <option value="🏠 用品">🏠 用品</option>
      <option value="💉 疫苗">💉 疫苗</option>
      <option value="❓ 其他">❓ 其他</option>
    </select>
    <br><br>
    <input type="text" id="expName" placeholder="品項">
    <br><br>
    <input type="number" id="expAmount" placeholder="金額" step="0.01">
    <br><br>
    <input type="text" id="expNote" placeholder="備註">
    <br><br>
    <button class="btn" onclick="saveExpense()">儲存支出</button>
  </div>
  <div class="card">
    <h2>📊 支出統計</h2>
    <div id="expenseStats" class="grid"></div>
  </div>
  <div class="card"><h2>📋 支出列表</h2><div id="expenseList"></div></div>
</div>

<div id="page-settings" class="page">
  <div class="card">
    <h2>⚙️ 設定</h2>
    <button class="btn" onclick="exportData()">📤 匯出資料</button>
    <br><br>
    <button class="btn" style="background:#f44336" onclick="clearAll()">🗑️ 清除所有資料</button>
  </div>
  <div class="card"><h2>🐱 管理貓咪</h2><div id="manageCats"></div></div>
</div>

<div class="bottom-nav">
  <button class="active" onclick="goPage('profile',this)"><span>🐱</span>貓咪</button>
  <button onclick="goPage('daily',this)"><span>🍽️</span>日常</button>
  <button onclick="goPage('abnormal',this)"><span>⚠️</span>異常</button>
  <button onclick="goPage('hospital',this)"><span>🏥</span>醫院</button>
  <button onclick="goPage('vaccine',this)"><span>💉</span>疫苗</button>
  <button onclick="goPage('diary',this)"><span>📔</span>日記</button>
  <button onclick="goPage('expense',this)"><span>💰</span>支出</button>
  <button onclick="goPage('settings',this)"><span>⚙️</span>設定</button>
</div>

<div id="overlay" class="overlay" onclick="closeCatPanel()"></div>
<div id="catPanel" class="panel">
  <div class="panel-top">
    <h2 id="catPanelTitle">🐱 新增貓咪</h2>
    <button class="panel-close" onclick="closeCatPanel()">×</button>
  </div>
  <input type="text" id="catName" placeholder="名字">
  <br><br>
  <label>生日</label>
  <input type="date" id="catBday">
  <br><br>
  <label>收養日</label>
  <input type="date" id="catAdopt">
  <br><br>
  <input type="text" id="catBreed" placeholder="品種">
  <br><br>
  <select id="catGender">
    <option value="male">♂ 公</option>
    <option value="female">♀ 母</option>
  </select>
  <br><br>
  <input type="text" id="catColor" placeholder="毛色">
  <br><br>
  <button class="btn" onclick="saveCat()">儲存貓咪</button>
</div>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyBaACJW2JaO05JXeUcpnoTsCAdU1zwPSMw",
  authDomain: "cat-care-c8b8f.firebaseapp.com",
  databaseURL: "https://cat-care-c8b8f-default-rtdb.firebaseio.com",
  projectId: "cat-care-c8b8f",
  storageBucket: "cat-care-c8b8f.firebasestorage.app",
  messagingSenderId: "1052070008926",
  appId: "1:1052070008926:web:64d56501c68e70000ffccf"
};

firebase.initializeApp(firebaseConfig);
var db = firebase.database();

var isReady = false;
var editingCatIndex = -1;

var data = JSON.parse(localStorage.getItem("cc3") || "null") || {
  cats: [],
  food: [],
  toilet: [],
  abnormal: [],
  hospital: [],
  vaccine: [],
  diary: [],
  expense: [],
  ci: 0
};

function uid(){
  return Date.now() + "_" + Math.random().toString(36).slice(2, 10);
}

function toArray(v){
  if(!v) return [];
  if(Array.isArray(v)) return v.filter(Boolean);
  return Object.values(v).filter(Boolean);
}

function normalizeData(obj){
  obj = obj || {};
  data = {
    cats: toArray(obj.cats),
    food: toArray(obj.food),
    toilet: toArray(obj.toilet),
    abnormal: toArray(obj.abnormal),
    hospital: toArray(obj.hospital),
    vaccine: toArray(obj.vaccine),
    diary: toArray(obj.diary),
    expense: toArray(obj.expense),
    ci: obj.ci || 0
  };
  data.cats.forEach(function(c){
    if(!c.id) c.id = uid();
    if(!c.weights) c.weights = [];
  });
}

function showBar(msg,type){
  var bar = document.getElementById("syncBar");
  bar.textContent = msg;
  bar.className = "sync-bar show " + (type || "");
  setTimeout(function(){bar.classList.remove("show")},2500);
}

function saveAll(){
  localStorage.setItem("cc3", JSON.stringify(data));
  if(!isReady) return;
  showBar("🔄 同步中...","loading");
  db.ref("catcare").set(data,function(err){
    if(err){
      console.error(err);
      showBar("❌ 同步失敗: " + err.message,"error");
    }else{
      showBar("✅ 已同步");
    }
  });
}

function saveList(path,list,after){
  localStorage.setItem("cc3", JSON.stringify(data));
  if(!isReady){
    if(after) after();
    return;
  }
  showBar("🔄 同步中...","loading");
  db.ref("catcare/" + path).set(list,function(err){
    if(err){
      console.error(err);
      showBar("❌ 儲存失敗: " + err.message,"error");
    }else{
      showBar("✅ 已同步");
      if(after) after();
    }
  });
}

function today(){
  return new Date().toISOString().split("T")[0];
}

function nowLocal(){
  var n = new Date();
  return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0")+"T"+String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0");
}

function esc(s){
  return String(s || "").replace(/[&<>"']/g,function(m){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m];
  });
}

function fillSelects(){
  ["foodCat","toiletCat","abnCat","hospCat","vacCat","expCat"].forEach(function(id){
    var el = document.getElementById(id);
    if(!el) return;
    el.innerHTML = data.cats.map(function(c,i){
      return '<option value="'+i+'">🐱 '+esc(c.name)+'</option>';
    }).join("");
  });
}

function refresh(){
  fillSelects();
  showProfile();
  showDaily();
  showAbnormal();
  showHospital();
  showVaccine();
  showDiary();
  showExpense();
  showSettings();
}

function goPage(name,btn){
  document.querySelectorAll(".page").forEach(function(p){p.classList.remove("active")});
  document.getElementById("page-" + name).classList.add("active");
  document.querySelectorAll(".bottom-nav button").forEach(function(b){b.classList.remove("active")});
  if(btn) btn.classList.add("active");
  refresh();
}

function openCatPanel(index){
  editingCatIndex = typeof index === "number" ? index : -1;
  document.getElementById("catPanelTitle").textContent = editingCatIndex >= 0 ? "✏️ 編輯貓咪" : "🐱 新增貓咪";

  var c = editingCatIndex >= 0 ? data.cats[editingCatIndex] : {};
  document.getElementById("catName").value = c.name || "";
  document.getElementById("catBday").value = c.bday || "";
  document.getElementById("catAdopt").value = c.adopt || "";
  document.getElementById("catBreed").value = c.breed || "";
  document.getElementById("catGender").value = c.gender || "male";
  document.getElementById("catColor").value = c.color || "";

  document.getElementById("overlay").classList.add("show");
  document.getElementById("catPanel").classList.add("show");
}

function closeCatPanel(){
  document.getElementById("overlay").classList.remove("show");
  document.getElementById("catPanel").classList.remove("show");
  editingCatIndex = -1;
}

function saveCat(){
  var name = document.getElementById("catName").value.trim();
  if(!name){ alert("請輸入名字"); return; }

  var cat = {
    id: editingCatIndex >= 0 ? data.cats[editingCatIndex].id : uid(),
    name: name,
    bday: document.getElementById("catBday").value,
    adopt: document.getElementById("catAdopt").value,
    breed: document.getElementById("catBreed").value,
    gender: document.getElementById("catGender").value,
    color: document.getElementById("catColor").value,
    weights: editingCatIndex >= 0 ? (data.cats[editingCatIndex].weights || []) : []
  };

  if(editingCatIndex >= 0){
    var oldId = data.cats[editingCatIndex].id;
    data.cats[editingCatIndex] = cat;
    ["food","toilet","abnormal","hospital","vaccine","expense"].forEach(function(k){
      data[k].forEach(function(r){
        if(r.catId === oldId) r.catName = name;
      });
    });
  }else{
    data.cats.push(cat);
    data.ci = data.cats.length - 1;
  }

  closeCatPanel();
  saveAll();
  refresh();
}

function deleteCat(i){
  if(!confirm("確定刪除 " + data.cats[i].name + "？")) return;
  var id = data.cats[i].id;
  data.cats.splice(i,1);
  ["food","toilet","abnormal","hospital","vaccine","expense"].forEach(function(k){
    data[k] = data[k].filter(function(r){return r.catId !== id});
  });
  data.ci = 0;
  saveAll();
  refresh();
}

function showProfile(){
  var tabs = document.getElementById("catTabs");
  var card = document.getElementById("profileCard");
  var weightCard = document.getElementById("weightCard");

  tabs.innerHTML = "";

  if(!data.cats.length){
    card.innerHTML = '<div class="empty"><span>🐱</span><p>點擊右上角 ＋ 新增貓咪</p></div>';
    weightCard.style.display = "none";
    return;
  }

  if(data.ci >= data.cats.length) data.ci = 0;

  data.cats.forEach(function(c,i){
    var b = document.createElement("button");
    b.className = "cat-tab" + (i === data.ci ? " active" : "");
    b.textContent = "🐱 " + c.name;
    b.onclick = function(){
      data.ci = i;
      saveAll();
      showProfile();
    };
    tabs.appendChild(b);
  });

  var c = data.cats[data.ci];
  card.innerHTML =
    '<div class="photo-placeholder">🐱</div>' +
    '<h2 style="text-align:center">'+esc(c.name)+'</h2>' +
    '<div style="text-align:center;margin-bottom:10px"><button class="btn-edit" onclick="openCatPanel('+data.ci+')">✏️ 編輯</button></div>' +
    infoRow("🎂 生日", c.bday || "未登記") +
    infoRow("🏠 收養日", c.adopt || "未登記") +
    infoRow("🐾 品種", c.breed || "未登記") +
    infoRow("⚧ 性別", c.gender === "female" ? "♀ 母" : "♂ 公") +
    infoRow("🎨 毛色", c.color || "未登記");

  weightCard.style.display = "block";
  showWeights();
}

function infoRow(a,b){
  return '<div class="info-row"><span class="label">'+a+'</span><span class="value">'+esc(b)+'</span></div>';
}

function addWeight(){
  if(!data.cats.length) return;
  var v = parseFloat(document.getElementById("weightValue").value);
  var d = document.getElementById("weightDate").value || today();
  if(!v || v <= 0){ alert("請輸入體重"); return; }
  data.cats[data.ci].weights.push({id:uid(),date:d,value:v});
  data.cats[data.ci].weights.sort(function(a,b){return a.date.localeCompare(b.date)});
  document.getElementById("weightValue").value = "";
  saveAll();
  showWeights();
}

function deleteWeight(id){
  data.cats[data.ci].weights = data.cats[data.ci].weights.filter(function(w){return w.id !== id});
  saveAll();
  showWeights();
}

function showWeights(){
  var el = document.getElementById("weightList");
  var c = data.cats[data.ci];
  if(!c || !c.weights || !c.weights.length){
    el.innerHTML = '<div class="empty"><p>還沒有體重記錄</p></div>';
    return;
  }
  el.innerHTML = "<br>" + c.weights.slice().reverse().map(function(w){
    return '<div class="record"><b>'+esc(w.date)+'</b>： '+w.value+' kg <button class="btn-del" style="float:right" onclick="deleteWeight(\''+w.id+'\')">刪除</button></div>';
  }).join("");
}

function getCatFromSelect(id){
  if(!data.cats.length){ alert("請先新增貓咪"); return null; }
  return data.cats[document.getElementById(id).value];
}

function saveFood(){
  var c = getCatFromSelect("foodCat"); if(!c) return;
  data.food.push({
    id: uid(), catId: c.id, catName: c.name,
    date: document.getElementById("foodDate").value || today(),
    dry: Number(document.getElementById("foodDry").value || 0),
    wet: Number(document.getElementById("foodWet").value || 0),
    water: Number(document.getElementById("foodWater").value || 0),
    note: document.getElementById("foodNote").value
  });
  ["foodDry","foodWet","foodWater","foodNote"].forEach(function(id){document.getElementById(id).value=""});
  saveList("food",data.food,showDaily);
}

function saveToilet(){
  var c = getCatFromSelect("toiletCat"); if(!c) return;
  data.toilet.push({
    id: uid(), catId: c.id, catName: c.name,
    date: document.getElementById("toiletDate").value || nowLocal(),
    poopCount: Number(document.getElementById("poopCount").value),
    peeCount: Number(document.getElementById("peeCount").value),
    poopType: document.getElementById("poopType").value,
    note: document.getElementById("toiletNote").value
  });
  document.getElementById("toiletNote").value = "";
  document.getElementById("toiletDate").value = nowLocal();
  saveList("toilet",data.toilet,showDaily);
}

function deleteRecord(type,id){
  if(!confirm("確定刪除？")) return;
  data[type] = data[type].filter(function(r){return r.id !== id});
  saveList(type,data[type],refresh);
}

function showDaily(){
  showDailyWarning();

  var todayStr = today();
  var todayFood = data.food.filter(function(f){return f.date === todayStr});
  var todayToilet = data.toilet.filter(function(t){return String(t.date).slice(0,10) === todayStr});
  var totalWater = todayFood.reduce(function(s,f){return s + Number(f.water || 0)},0);
  var totalPee = todayToilet.reduce(function(s,t){return s + Number(t.peeCount || 0)},0);

  document.getElementById("dailyStats").innerHTML =
    statBox(todayFood.length,"今日飲食") +
    statBox(todayToilet.length,"今日排泄") +
    statBox(totalWater + " ml","今日飲水") +
    statBox(totalPee,"今日尿塊");

  var all = [];
  data.food.forEach(function(f){
    all.push({
      sort:f.date,
      html:'<div class="record"><div class="record-title">🍽️ '+esc(f.catName)+' 飲食</div><div class="record-meta">'+esc(f.date)+'</div><div class="record-note">乾糧 '+f.dry+'g，罐頭 '+f.wet+'g，水 '+f.water+'ml</div>'+(f.note?'<div class="record-note">📝 '+esc(f.note)+'</div>':'')+'<div class="record-actions"><button class="btn-del" onclick="deleteRecord(\'food\',\''+f.id+'\')">刪除</button></div></div>'
    });
  });
  data.toilet.forEach(function(t){
    all.push({
      sort:t.date,
      html:'<div class="record"><div class="record-title">🚽 '+esc(t.catName)+' 排泄</div><div class="record-meta">'+esc(String(t.date).replace("T"," "))+'</div><div class="record-note">大便 '+t.poopCount+' 次，尿 '+t.peeCount+' 塊，狀態：'+esc(t.poopType)+'</div>'+(t.note?'<div class="record-note">📝 '+esc(t.note)+'</div>':'')+'<div class="record-actions"><button class="btn-del" onclick="deleteRecord(\'toilet\',\''+t.id+'\')">刪除</button></div></div>'
    });
  });
  all.sort(function(a,b){return String(b.sort).localeCompare(String(a.sort))});
  document.getElementById("dailyList").innerHTML = all.length ? all.map(function(x){return x.html}).join("") : '<div class="empty"><span>📋</span><p>還沒有記錄</p></div>';
}

function statBox(num,txt){
  return '<div class="stat"><div class="num">'+num+'</div><div class="txt">'+txt+'</div></div>';
}

function showDailyWarning(){
  var warns = [];
  data.cats.forEach(function(c){
    var list = data.toilet.filter(function(t){return t.catId === c.id});
    if(!list.length) return;
    list.sort(function(a,b){return String(b.date).localeCompare(String(a.date))});
    var last = new Date(list[0].date).getTime();
    if(Date.now() - last > 2 * 86400000) warns.push(c.name);
  });
  document.getElementById("dailyWarning").innerHTML = warns.length ? '<div class="warning">⚠️ '+warns.join("、")+' 超過 2 天沒有排泄記錄</div>' : "";
}

function toggleChip(el){
  el.classList.toggle("active");
}

function saveAbnormal(){
  var c = getCatFromSelect("abnCat"); if(!c) return;
  var symptoms = Array.from(document.querySelectorAll("#symptomRow .chip.active")).map(function(b){return b.textContent.trim()});
  if(!symptoms.length){alert("請選擇症狀");return;}
  data.abnormal.push({
    id:uid(), catId:c.id, catName:c.name,
    date:document.getElementById("abnDate").value || nowLocal(),
    symptoms:symptoms,
    desc:document.getElementById("abnDesc").value
  });
  document.querySelectorAll("#symptomRow .chip").forEach(function(b){b.classList.remove("active")});
  document.getElementById("abnDesc").value = "";
  saveList("abnormal",data.abnormal,showAbnormal);
}

function showAbnormal(){
  var el = document.getElementById("abnList");
  el.innerHTML = data.abnormal.length ? data.abnormal.slice().reverse().map(function(r){
    return '<div class="record"><div class="record-title">⚠️ '+esc(r.catName)+'</div><div class="record-meta">'+esc(String(r.date).replace("T"," "))+'</div><div class="record-note">'+r.symptoms.map(esc).join("、")+'</div>'+(r.desc?'<div class="record-note">📝 '+esc(r.desc)+'</div>':'')+'<div class="record-actions"><button class="btn-del" onclick="deleteRecord(\'abnormal\',\''+r.id+'\')">刪除</button></div></div>';
  }).join("") : '<div class="empty"><span>✅</span><p>沒有異常記錄</p></div>';
}

function saveHospital(){
  var c = getCatFromSelect("hospCat"); if(!c) return;
  var reason = document.getElementById("hospReason").value.trim();
  if(!reason){alert("請輸入就診原因");return;}
  data.hospital.push({
    id:uid(), catId:c.id, catName:c.name,
    date:document.getElementById("hospDate").value || today(),
    reason:reason,
    hospital:document.getElementById("hospName").value,
    note:document.getElementById("hospNote").value,
    cost:Number(document.getElementById("hospCost").value || 0)
  });
  ["hospReason","hospName","hospNote","hospCost"].forEach(function(id){document.getElementById(id).value=""});
  saveList("hospital",data.hospital,showHospital);
}

function showHospital(){
  var el = document.getElementById("hospList");
  el.innerHTML = data.hospital.length ? data.hospital.slice().sort(function(a,b){return b.date.localeCompare(a.date)}).map(function(r){
    return '<div class="record"><div class="record-title">🏥 '+esc(r.reason)+'</div><div class="record-meta">'+esc(r.date)+'　<span class="badge">🐱 '+esc(r.catName)+'</span></div>'+(r.hospital?'<div class="record-note">醫院：'+esc(r.hospital)+'</div>':'')+(r.note?'<div class="record-note">📝 '+esc(r.note)+'</div>':'')+(r.cost?'<div class="record-note">💰 $'+r.cost+'</div>':'')+'<div class="record-actions"><button class="btn-del" onclick="deleteRecord(\'hospital\',\''+r.id+'\')">刪除</button></div></div>';
  }).join("") : '<div class="empty"><span>🏥</span><p>還沒有記錄</p></div>';
}

function saveVaccine(){
  var c = getCatFromSelect("vacCat"); if(!c) return;
  var d = document.getElementById("vacDate").value || today();
  var type = document.getElementById("vacType").value;
  var next = document.getElementById("vacNext").value;

  if(!next){
    var nd = new Date(d);
    if(type.indexOf("驅蟲") >= 0){
      if(type === "體外驅蟲") nd.setMonth(nd.getMonth()+1);
      else nd.setMonth(nd.getMonth()+3);
    }else{
      nd.setFullYear(nd.getFullYear()+1);
    }
    next = nd.toISOString().split("T")[0];
  }

  data.vaccine.push({
    id:uid(), catId:c.id, catName:c.name,
    type:type, date:d, nextDate:next,
    note:document.getElementById("vacNote").value
  });
  document.getElementById("vacNext").value = "";
  document.getElementById("vacNote").value = "";
  saveList("vaccine",data.vaccine,showVaccine);
}

function showVaccine(){
  var el = document.getElementById("vacList");
  if(!data.vaccine.length){
    el.innerHTML = '<div class="empty"><span>💉</span><p>還沒有記錄</p></div>';
    return;
  }
  el.innerHTML = data.vaccine.slice().sort(function(a,b){return b.date.localeCompare(a.date)}).map(function(v){
    var days = Math.ceil((new Date(v.nextDate).getTime() - Date.now()) / 86400000);
    var status = days < 0 ? "🚨 已過期 " + Math.abs(days) + " 天" : days <= 7 ? "⏰ " + days + " 天後到期" : "✅ 還有 " + days + " 天";
    return '<div class="record"><div class="record-title">💉 '+esc(v.type)+'</div><div class="record-meta"><span class="badge">🐱 '+esc(v.catName)+'</span></div><div class="record-note">上次：'+esc(v.date)+'<br>下次：'+esc(v.nextDate)+'<br>'+status+'</div>'+(v.note?'<div class="record-note">📝 '+esc(v.note)+'</div>':'')+'<div class="record-actions"><button class="btn-del" onclick="deleteRecord(\'vaccine\',\''+v.id+'\')">刪除</button></div></div>';
  }).join("");
}

function saveDiary(){
  var text = document.getElementById("diaryText").value.trim();
  if(!text){alert("請輸入日記內容");return;}
  data.diary.push({
    id:uid(),
    date:document.getElementById("diaryDate").value || today(),
    text:text
  });
  document.getElementById("diaryText").value = "";
  saveList("diary",data.diary,showDiary);
}

function showDiary(){
  var el = document.getElementById("diaryList");
  el.innerHTML = data.diary.length ? data.diary.slice().reverse().map(function(d){
    return '<div class="record"><div class="record-title">📅 '+esc(d.date)+'</div><div class="record-note">'+esc(d.text)+'</div><div class="record-actions"><button class="btn-del" onclick="deleteRecord(\'diary\',\''+d.id+'\')">刪除</button></div></div>';
  }).join("") : '<div class="empty"><span>📔</span><p>還沒有日記</p></div>';
}

function saveExpense(){
  var c = getCatFromSelect("expCat"); if(!c) return;
  var name = document.getElementById("expName").value.trim();
  var amount = Number(document.getElementById("expAmount").value);
  if(!name){alert("請輸入品項");return;}
  if(!amount || amount <= 0){alert("請輸入金額");return;}
  data.expense.push({
    id:uid(), catId:c.id, catName:c.name,
    date:document.getElementById("expDate").value || today(),
    category:document.getElementById("expCategory").value,
    name:name,
    amount:amount,
    note:document.getElementById("expNote").value
  });
  ["expName","expAmount","expNote"].forEach(function(id){document.getElementById(id).value=""});
  saveList("expense",data.expense,showExpense);
}

function showExpense(){
  var total = data.expense.reduce(function(s,e){return s + Number(e.amount || 0)},0);
  document.getElementById("expenseStats").innerHTML = statBox("$" + total.toFixed(2),"總支出") + statBox(data.expense.length,"筆數");

  var el = document.getElementById("expenseList");
  el.innerHTML = data.expense.length ? data.expense.slice().sort(function(a,b){return b.date.localeCompare(a.date)}).map(function(e){
    return '<div class="record"><div class="record-title">'+esc(e.name)+'　$'+Number(e.amount).toFixed(2)+'</div><div class="record-meta">'+esc(e.date)+'　<span class="badge">'+esc(e.category)+'</span>　🐱 '+esc(e.catName)+'</div>'+(e.note?'<div class="record-note">📝 '+esc(e.note)+'</div>':'')+'<div class="record-actions"><button class="btn-del" onclick="deleteRecord(\'expense\',\''+e.id+'\')">刪除</button></div></div>';
  }).join("") : '<div class="empty"><span>💰</span><p>還沒有支出記錄</p></div>';
}

function showSettings(){
  var el = document.getElementById("manageCats");
  el.innerHTML = data.cats.length ? data.cats.map(function(c,i){
    return '<div class="record"><b>🐱 '+esc(c.name)+'</b><div class="record-actions"><button class="btn-edit" onclick="openCatPanel('+i+')">編輯</button><button class="btn-del" onclick="deleteCat('+i+')">刪除</button></div></div>';
  }).join("") : '<div class="empty"><span>🐱</span><p>還沒有貓咪</p></div>';
}

function exportData(){
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));
  a.download = "cat-care-backup.json";
  a.click();
}

function clearAll(){
  if(!confirm("確定清除所有資料？")) return;
  localStorage.removeItem("cc3");
  db.ref("catcare").remove(function(){
    location.reload();
  });
}

function initDates(){
  ["foodDate","hospDate","vacDate","diaryDate","expDate","weightDate"].forEach(function(id){
    var el = document.getElementById(id);
    if(el) el.value = today();
  });
  document.getElementById("toiletDate").value = nowLocal();
  document.getElementById("abnDate").value = nowLocal();
}

function init(){
  initDates();
  refresh();

  showBar("🔄 登入中...","loading");

  firebase.auth().signInAnonymously().then(function(){
    showBar("🔄 連線中...","loading");

    db.ref("catcare").on("value",function(snapshot){
      var remote = snapshot.val();
      if(remote){
        normalizeData(remote);
        localStorage.setItem("cc3", JSON.stringify(data));
      }else{
        normalizeData(data);
        saveAll();
      }

      isReady = true;
      showBar("✅ 已連線");
      refresh();
    },function(error){
      console.error(error);
      isReady = false;
      showBar("❌ 連線失敗: " + error.message,"error");
      refresh();
    });

  }).catch(function(error){
    console.error(error);
    isReady = false;
    showBar("❌ 登入失敗: " + error.message,"error");
    refresh();
  });
}

init();
</script>
